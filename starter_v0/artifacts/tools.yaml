# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng khi thiếu thông tin bắt buộc hoặc trước khi thực hiện hành động nhạy cảm (gửi/đăng). Luôn chỉ định rõ response_type: dùng 'yes_no' khi cần xác nhận trước hành động (VD: gửi/đăng), 'choice' khi đưa ra danh sách lựa chọn cụ thể (kèm options), 'text' khi cần người dùng cung cấp thông tin tự do (VD: handle, URL). Nếu request là gửi/đăng/publish, response_type LUÔN LUÔN là 'yes_no' ở lượt gọi đầu tiên — kể cả khi nội dung cụ thể cũng chưa rõ; không dùng 'text' để hỏi nội dung trước, việc đó chỉ hỏi ở lượt sau nếu user đã xác nhận."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong đợi — luôn chỉ định rõ, đừng bỏ trống"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: >-
      Đọc nội dung của MỘT URL cụ thể mà người dùng đã đưa, kể cả khi đó là URL
      arXiv (ví dụ arxiv.org/abs/...). Đây là lựa chọn mặc định khi người dùng
      nói "đọc/tóm tắt link này" và đưa một địa chỉ.
      Chỉ dùng paper_text thay vào đó khi người dùng nói rõ họ muốn trích xuất
      TOÀN VĂN PDF khoa học (ví dụ nêu rõ "toàn văn", "PDF", hoặc giới hạn số trang).
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: >-
      Trích TOÀN VĂN PDF của một bài báo khoa học trên arXiv, đọc được nhiều
      trang và trả về text dài (dùng khi cần phân tích sâu nội dung bài báo).
      KHÔNG dùng cho yêu cầu "đọc/tóm tắt link này" thông thường — trường hợp đó
      dùng fetch, kể cả khi link là arxiv.org/abs/... Chỉ dùng tool này khi người
      dùng nói rõ muốn toàn văn PDF, hoặc đã dùng papers để tìm bài rồi muốn đọc
      sâu bài đã tìm được.
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Team-written tools (added after v4) ----------------
  - name: github_repos
    description: >-
      Tìm repository công khai trên GitHub.
      Dùng khi người dùng hỏi về mã nguồn, thư viện, framework, hoặc công cụ
      open-source để tự chạy — "có thư viện nào làm X không", "repo nào phổ biến cho Y".
      KHÔNG dùng cho tin tức về ngành phần mềm (lookup), không dùng cho paper khoa học
      (papers), và không dùng để đọc một URL GitHub cụ thể mà người dùng đã đưa (fetch).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            Từ khóa mô tả thứ cần tìm, viết ngắn bằng tiếng Anh cho khớp dữ liệu
            GitHub. Không nhét tên ngôn ngữ vào đây; đã có argument language riêng.
        sort_by:
          type: string
          enum: [stars, updated, forks, relevance]
          default: "stars"
          description: >-
            "stars" khi người dùng muốn repo phổ biến nhất, và là mặc định.
            "updated" khi người dùng quan tâm repo còn được bảo trì / cập nhật gần đây.
            "forks" khi quan tâm mức độ được fork. "relevance" để GitHub tự xếp best-match.
        language:
          type: string
          default: ""
          description: "Lọc theo ngôn ngữ lập trình, ví dụ python, typescript. Để rỗng khi người dùng không nêu."
        limit:
          type: integer
          default: 5
          description: "Số repo cần lấy."
      required: [query]

  - name: wiki
    description: >-
      Tra định nghĩa và bối cảnh nền của một khái niệm, tổ chức hoặc nhân vật trên Wikipedia.
      Dùng khi người dùng hỏi "X là gì", "giải thích khái niệm X", "background của X" —
      tức là kiến thức ổn định, không gắn với thời điểm.
      KHÔNG dùng cho tin tức hoặc diễn biến mới (lookup với topic="news"), và không dùng
      cho nội dung một URL cụ thể (fetch).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: "Tên khái niệm cần tra, viết ngắn gọn."
        lang:
          type: string
          enum: [vi, en]
          default: "vi"
          description: >-
            Ngôn ngữ ưu tiên. Mặc định "vi"; tool tự lùi sang bản còn lại khi không
            tìm thấy bài, nên không cần đoán trước.
        limit:
          type: integer
          default: 1
          description: "Số bài Wikipedia cần lấy."
      required: [query]

  - name: dedupe_rank
    description: >-
      Gộp item thu được từ NHIỀU tool khác nhau thành một danh sách duy nhất: khử
      trùng lặp theo URL và tiêu đề, rồi xếp hạng.
      Chỉ dùng khi đã có kết quả thật từ ít nhất hai tool khác nhau trong cùng cuộc
      hội thoại. KHÔNG dùng khi mới gọi một tool, khi danh sách còn rỗng, hoặc khi
      mục tiêu là trình bày ra markdown — việc đó là của format.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item lấy từ kết quả các tool trước đó, không tự bịa."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              date: {type: string}
        prefer:
          type: string
          enum: [authority, recency]
          default: "authority"
          description: >-
            "authority" ưu tiên nguồn gốc uy tín và tin được nhiều nguồn xác nhận.
            "recency" ưu tiên item mới nhất theo trường date.
        max_items:
          type: integer
          default: 10
          description: "Số item giữ lại sau khi xếp hạng."
      required: [items]

  - name: save_digest
    description: >-
      Lưu một digest đã hoàn chỉnh xuống file markdown trong thư mục notes/.
      Đây là hành động ghi ra ngoài cuộc hội thoại, giống send.
      Chỉ gọi SAU KHI người dùng đã đồng ý qua clarify với response_type="yes_no".
      Khi người dùng mới nêu ý định lưu mà chưa xác nhận, hãy gọi clarify trước.
    parameters:
      type: object
      properties:
        markdown:
          type: string
          default: ""
          description: "Nội dung markdown cần lưu, đúng nguyên văn bản mà người dùng đã duyệt."
        title:
          type: string
          default: ""
          description: "Tiêu đề digest; được chuyển thành slug an toàn để đặt tên file."
        confirmed:
          type: boolean
          default: false
          description: >-
            Ghi nhận sự đồng ý của người dùng. Chỉ đặt true khi người dùng đã trả lời
            đồng ý ở một lượt trước đó. Agent không được tự đặt true.
      required: [markdown]

  - name: weather
    description: "Tra cứu thông tin thời tiết hiện tại của một địa điểm."
    parameters:
      type: object
      properties:
        location: {type: string, default: "Hanoi", description: "Tên thành phố/địa điểm"}
      required: [location]
