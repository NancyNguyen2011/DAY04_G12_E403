# Tool declarations for the research agent.
#
# Every description answers three things for the model: what the tool does, when
# NOT to reach for it, and what convention its arguments follow. Argument
# conventions live here rather than in the system prompt, so a tool stays correct
# even if the prompt is rewritten.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng và dừng lượt hiện tại. Dùng khi thiếu thông tin bắt buộc
      để gọi tool khác (không biết tài khoản nào, không có URL nào), hoặc khi cần
      người dùng chấp thuận trước một hành động ghi ra ngoài hội thoại.
      KHÔNG dùng để hỏi những thứ có thể suy ra từ chính câu người dùng vừa nói,
      và không dùng khi đã đủ thông tin để gọi tool.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi cụ thể, nêu rõ đang thiếu gì hoặc sắp làm gì."
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            Kiểu trả lời mong đợi, chọn theo bản chất câu hỏi.
            "yes_no" khi xin phê duyệt trước một hành động gửi/đăng/xuất bản/lưu —
            câu trả lời đúng chỉ có thể là đồng ý hoặc không.
            "text" khi cần người dùng cung cấp một giá trị còn thiếu như tên tài
            khoản hoặc đường link.
            "choice" khi người dùng chỉ cần chọn trong danh sách options cho sẵn.
        options:
          type: array
          default: []
          items: {type: string}
          description: "Các lựa chọn, chỉ dùng kèm response_type=choice."
      required: [question]

  - name: timeline
    description: >-
      Lấy các bài đăng gần đây TỪ MỘT TÀI KHOẢN cụ thể trên X/Twitter.
      Dùng khi người dùng hỏi một người/tổ chức đã đăng gì.
      KHÔNG dùng khi người dùng hỏi mọi người đang bàn gì về một chủ đề — đó là
      social_search. Chưa biết tài khoản nào thì gọi clarify chứ đừng đoán.
    parameters:
      type: object
      properties:
        screenname:
          type: string
          default: ""
          description: >-
            Handle X/Twitter, không có ký tự @ và không có khoảng trắng.
            Người dùng thường nói tên hiển thị; hãy chuyển thành handle thật của
            người đó (ví dụ dạng "Tên Người" -> "tennguoi" theo handle mà người
            đó thực sự dùng). Nếu không chắc handle nào thì gọi clarify.
        limit:
          type: integer
          default: 5
          description: "Số bài cần lấy. Người dùng nêu con số nào thì dùng đúng con số đó."
      required: [screenname]

  - name: social_search
    description: >-
      Tìm bài đăng trên X/Twitter THEO CHỦ ĐỀ, không giới hạn ở một tài khoản.
      Dùng khi người dùng muốn biết dư luận / mọi người đang nói gì về một thứ.
      KHÔNG dùng khi người dùng hỏi bài đăng của một người cụ thể (timeline), và
      không dùng cho tin tức báo chí (lookup).
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            Từ khóa chủ đề, viết ngắn gọn như khi gõ vào ô tìm kiếm.
            Chỉ giữ đúng chủ thể cần tìm; bỏ các từ dẫn như "mọi người nói gì về",
            "tìm giúp mình", và bỏ cả từ chỉ nền tảng như "trên Twitter".
        search_type:
          type: string
          enum: [Latest, Top]
          default: "Latest"
          description: >-
            "Top" khi người dùng muốn bài phổ biến / nổi bật / nhiều tương tác nhất.
            "Latest" khi người dùng muốn bài mới nhất, và là mặc định khi không nói rõ.
        limit:
          type: integer
          default: 5
          description: "Số bài cần lấy. Người dùng nêu con số nào thì dùng đúng con số đó."
      required: [query]

  - name: lookup
    description: >-
      Tìm thông tin trên web qua công cụ tìm kiếm. Dùng cho tin tức, sự kiện, và
      thông tin cần nguồn từ nhiều trang.
      KHÔNG dùng khi người dùng đã đưa sẵn một URL cụ thể — lúc đó dùng fetch.
      KHÔNG dùng cho bài đăng mạng xã hội (timeline / social_search).
      KHÔNG dùng cho câu hỏi ngoài phạm vi research như giải toán hay viết code.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            Từ khóa ngắn, chỉ gồm chủ thể cần tra. KHÔNG chép lại cả câu của
            người dùng và KHÔNG nhét thêm những gì đã được biểu diễn bằng argument
            khác: đã có topic="news" thì đừng thêm chữ "tin tức"/"news" vào query,
            đã có timeframe thì đừng thêm "hôm nay"/"today"/"tuần này" vào query.
            Ví dụ mẫu về độ dài mong muốn: "AI", "robotics", "chip bán dẫn".
        topic:
          type: string
          enum: [general, news]
          default: "general"
          description: >-
            "news" khi người dùng hỏi tin tức, thời sự, diễn biến mới.
            "general" cho thông tin tham khảo không gắn với thời điểm.
        timeframe:
          type: string
          enum: [day, week, month, year]
          default: "week"
          description: >-
            Khoảng thời gian lấy từ cách người dùng diễn đạt:
            "hôm nay"/"today" -> day; "tuần này"/"tuần qua" -> week;
            "tháng này" -> month; "năm nay" -> year.
        max_results:
          type: integer
          default: 5
          description: "Số kết quả cần lấy."
      required: [query]

  - name: fetch
    description: >-
      Đọc nội dung của MỘT URL cụ thể mà người dùng đã cung cấp.
      Dùng khi trong yêu cầu có sẵn đường link cần tóm tắt hoặc trích nội dung.
      KHÔNG dùng khi chưa có URL: người dùng nói "bài này", "link này" mà không
      kèm địa chỉ thì gọi clarify để xin link, tuyệt đối không tự đoán một URL.
    parameters:
      type: object
      properties:
        url:
          type: string
          default: ""
          description: "URL đầy đủ, lấy nguyên văn từ những gì người dùng đưa."
      required: [url]

  - name: format
    description: >-
      Trình bày các item ĐÃ THU THẬP ĐƯỢC thành markdown digest.
      Chỉ dùng sau khi một tool tìm kiếm/đọc đã trả về dữ liệu thật và người dùng
      muốn một bản tổng hợp. KHÔNG dùng để đi tìm dữ liệu, và không gọi khi danh
      sách item còn rỗng.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item lấy từ kết quả tool trước đó, không tự bịa."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template:
          type: string
          enum: [brief, sections, bullets, thread, daily_ai_vn]
          default: "sections"
          description: >-
            "brief" tóm tắt tối đa 5 mục; "bullets" danh sách gạch đầu dòng phẳng;
            "sections" nhóm theo section; "thread" đánh số kiểu chuỗi bài đăng;
            "daily_ai_vn" bản tin hằng ngày có tiêu đề và nhóm mục.
        headline:
          type: string
          default: ""
          description: "Tiêu đề của digest."
      required: [items, template]

  # ---------------- Optional built-ins ----------------
  - name: send
    description: >-
      Gửi một đoạn văn bản lên Telegram channel. Đây là hành động ghi ra ngoài
      cuộc hội thoại và không thu hồi được.
      Chỉ gọi SAU KHI người dùng đã đồng ý qua clarify với response_type="yes_no".
      Khi người dùng mới nêu ý định gửi/đăng mà chưa xác nhận, hãy gọi clarify
      trước chứ không gọi tool này.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: "Nội dung cần gửi, đúng nguyên văn những gì người dùng đã duyệt."
        confirmed:
          type: boolean
          default: false
          description: >-
            Ghi nhận sự đồng ý của người dùng. Chỉ đặt true khi người dùng đã trả
            lời đồng ý ở một lượt trước đó. Agent không được tự đặt true.
      required: [text]

  - name: policy
    description: >-
      Tra quy định nội bộ của công ty trong bộ tài liệu markdown có sẵn.
      Dùng khi câu hỏi liên quan tới quy tắc nội bộ: được phép làm gì, phải trích
      nguồn ra sao, xử lý dữ liệu cá nhân thế nào, quy trình duyệt trước khi đăng.
      KHÔNG dùng để tra thông tin công khai trên internet — đó là lookup.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cần tra trong tài liệu nội bộ."}
        policy_area:
          type: string
          enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage]
          default: "all"
          description: "Giới hạn theo nhóm tài liệu; để 'all' khi chưa rõ thuộc nhóm nào."
        top_k: {type: integer, default: 3, description: "Số đoạn trả về."}
      required: [query]

  - name: papers
    description: >-
      Tìm bài báo khoa học trên arXiv theo từ khóa.
      Dùng khi người dùng hỏi nghiên cứu, paper, công bố khoa học.
      KHÔNG dùng cho tin tức phổ thông (lookup), và không dùng khi người dùng đã
      có sẵn một paper cụ thể cần đọc nội dung (paper_text).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa nghiên cứu, viết bằng tiếng Anh cho khớp dữ liệu arXiv."}
        max_results: {type: integer, default: 5, description: "Số paper cần lấy."}
        sort_by:
          type: string
          enum: [relevance, lastUpdatedDate, submittedDate]
          default: "relevance"
          description: "'submittedDate' khi người dùng muốn paper mới nhất; 'relevance' khi muốn paper liên quan nhất."
      required: [query]

  - name: paper_text
    description: >-
      Tải PDF của một paper arXiv đã biết và trích text.
      Dùng khi đã có ID hoặc link arXiv cụ thể và người dùng muốn nội dung bên trong.
      KHÔNG dùng để đi tìm paper — việc tìm là của papers.
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID dạng 1706.03762 hoặc URL arXiv đầy đủ."}
        max_pages: {type: integer, default: 5, description: "Số trang PDF cần trích."}
        max_chars: {type: integer, default: 8000, description: "Giới hạn số ký tự trả về."}
      required: [arxiv_url]
